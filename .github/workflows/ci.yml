name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-lint:
    name: build-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
  # E2E (Playwright) is intentionally NOT wired into CI yet.
  # npm run test:e2e is red at HEAD in this repo (failing specs in shop,
  # checkout, wishlist, and the admin suites pre date this workflow change).
  # Add an e2e job only after the suite is green locally, then mirror:
  #   npm run build
  #   npx playwright install --with-deps chromium
  #   npm run test:e2e